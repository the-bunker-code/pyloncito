name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  check-full:
    name: check-full
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:full
      - name: Lighthouse móvil
        run: |
          node scripts/serve.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          CHROME_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          export CHROME_PATH
          pnpm exec lighthouse http://127.0.0.1:4321/juegos/mira-y-dime/             --only-categories=performance,accessibility,best-practices             --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate             --output=json --output-path=/tmp/lighthouse.json             --chrome-flags="--headless=new --no-sandbox --disable-gpu" --quiet
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync('/tmp/lighthouse.json', 'utf8'));
            const score = (name) => Math.round(report.categories[name].score * 100);
            const values = { performance: score('performance'), accessibility: score('accessibility'), bestPractices: score('best-practices') };
            console.log(values);
            if (values.performance < 90 || values.accessibility < 95 || values.bestPractices < 95) process.exit(1);
          "
