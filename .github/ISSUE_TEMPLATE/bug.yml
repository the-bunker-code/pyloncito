name: Bug
description: Algo no funciona como se esperaba.
title: '[Bug] '
labels:
  - tipo/bug
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué pasa
      description: Describí el problema en una o dos frases.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir ...
        2. Tocar ...
        3. Ver ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Navegador, sistema, viewport y commit.
      placeholder: Chrome 142, Linux, 390×844, abc1234
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Consola y capturas
      description: Pegá errores de consola o adjuntá imágenes.
      placeholder: |
        ```text
        ...
        ```
